name: Pascal Terminal

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests openpyxl

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd src
          python briefing_engine_v2.py

      - name: Copy to dashboard
        run: |
          cp dashboard/latest_briefing.json dashboard/latest_briefing.json || true

      - name: Commit
        run: |
          git config --global user.email "bot@pascal.com"
          git config --global user.name "Pascal Bot"
          git add dashboard/latest_briefing.json || true
          git diff --staged --quiet || git commit -m "Briefing $(date +%Y-%m-%d)"
          git push || true
